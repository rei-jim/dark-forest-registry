/* ============================================================================
   THE DARK FOREST REGISTRY - a spoiler-safe who's-who of Liu Cixin's
   REMEMBRANCE OF EARTH'S PAST (books I–III only; Book IV is not canon here).
   ----------------------------------------------------------------------------
   One tab per book. Each book is a separate constellation: characters are
   grouped into "clusters" (affiliations), drawn as stars, and clicking a star
   opens a dossier with a SPOILER-FREE description.

   The spoiler rule, applied throughout:
     - a character's entry for book N describes them as they stand when the
       reader MEETS them in book N, never by what they later turn out to be;
     - a character who recurs gets a NEW description per book, so the book I
       tab never leaks book II;
     - no deaths, no twists, no reveals, no outcomes;
     - clusters whose very NAME is a mid-book reveal are titled obliquely
       (e.g. "The Organization").

   Inherent, unavoidable leak - stated plainly in the UI too: a character
   listed under book III is, by that fact alone, still in the story by then.
   That is the same trade the volume dial in the MDZS register made.

   Everything is data. To edit, touch CLUSTERS and CAST below; nothing else.
   ========================================================================== */

const BOOKS = [
  { n: 1, title: "The Three-Body Problem", cn: "三体", roman: "I",
    tagline: "A physicist is dead, an experiment is lying, and a nanomaterials researcher is asked to look into it." },
  { n: 2, title: "The Dark Forest", cn: "黑暗森林", roman: "II",
    tagline: "The world has four hundred years to prepare, and has just discovered it cannot keep a secret." },
  { n: 3, title: "Death's End", cn: "死神永生", roman: "III",
    tagline: "An engineer wakes into other people's futures, again and again, and is handed the choice each time." },
];

  org:     { name: "The Organization",          hanzi: "组", color: "#e0605e",
             note: "A movement whose real name and purpose you are better off meeting inside the book." },
  redcoast:{ name: "Red Coast Base",            hanzi: "岸", color: "#d873ad" },
  before:  { name: "The years before",          hanzi: "昔", color: "#a2957c",
             note: "China, 1966 onward - the story's oldest wound." },
  game:    { name: "The game",                  hanzi: "戏", color: "#9a86ee",
             note: "Avatars inside a very strange piece of software. Some are players, some are not." },
  tri:     { name: "Trisolaris",                hanzi: "三", color: "#54c79a" },

  un:      { name: "The United Nations",        hanzi: "联", color: "#c0c8d4" },
  common:  { name: "Ordinary lives",            hanzi: "民", color: "#9fb39c" },
  fleet:   { name: "Deep space",                hanzi: "航", color: "#6fd3b6" },
  byz:     { name: "Constantinople, 1453",      hanzi: "拜", color: "#cfa370" },
  tale:    { name: "Stories within the story",  hanzi: "话", color: "#dc9ad4",
             note: "People who exist only inside a tale someone tells on purpose." },
};

/* Each entry: id, name, (optional) aka, and a `books` map keyed by book number.
   Presence of key N = appears in book N. Each value:
     cluster, role  - affiliation and one-line label
     desc           - SPOILER-FREE: who they are when you first meet them
     spoiler        - FULL entry as of the END of that book. Never rendered
                      until the reader clicks the seal open. Assume everything
                      in here ruins something.                                */
const CAST = [
  // ---------- Book I core ----------
  { id: "wangmiao", name: "Wang Miao", books: {
    1: { cluster: "sci", role: "nanomaterials researcher",
      desc: "Runs a lab building a material stronger than anything has a right to be. He is asked - politely, then much less politely - to spend some time among physicists who are behaving oddly. Our eyes: a competent, decent man with no framework for what he is about to see.",
      spoiler: "A countdown appears in his photographs and then across his retinas; it stops when he suspends his nanomaterial research, which is the point - the sophons have been sabotaging particle accelerators and Wang's work is on the same list. Through the Three Body game he is recruited toward the ETO, attends the Adventist meeting that the police raid, and learns the whole shape of it: a fleet is coming, four centuries out, and physics has been locked shut in the meantime. His nanofilament is what ends the crisis phase - strung across the Panama Canal as the Guzheng Plan, it slices the tanker Judgment Day into pieces and recovers Evans's archive of Trisolaran messages. He ends the book inside the response, not outside it, listening to Ye Wenjie's confession." },
    } },
  { id: "dashi", name: "Shi Qiang", aka: "Da Shi", books: {
    1: { cluster: "security", role: "police detective",
      desc: "Rumpled, chain-smoking, crude, and repeatedly disciplined. He has no patience for theory and an unnerving instinct for which detail in a room is the load-bearing one. Wrong about manners, rarely wrong about people.",
      spoiler: "Ex-counterterrorism, suspended for methods, and pulled back in by Chang Weisi because he is the only person in the building who reacts correctly to the impossible: he simply does not care whether it is science or a conjuring trick, only who benefits. He walks Wang Miao through his breakdown with beer and contempt for despair, and it is Da Shi - not any scientist or general - who proposes the Guzheng Plan, the flat, brutal idea of cutting the ship rather than boarding it. It works. He is the book's argument that the species survives on the unimaginative and the stubborn." },
    2: { cluster: "security", role: "still a detective",
      desc: "Older, still smoking, still the man they send when a problem needs a bodyguard who also thinks. His method has not changed and has not needed to.",
      spoiler: "Assigned to Luo Ji as security and effectively as his handler, he keeps him alive through an assassination attempt he sees coming before anyone else, and finds Zhuang Yan on Luo Ji's absurd description of an imaginary woman. He hibernates and wakes with him into the Crisis Era's other end, still refusing to be awed. He is the one who tells Luo Ji, in the wilderness, that the universe's rules are just a bigger version of a bad neighbourhood - the closest thing to the dark forest anyone says out loud before Luo Ji works it out." },
    3: { cluster: "security", role: "an old friend",
      desc: "He turns up again, because of course he does. Same cigarette, same refusal to be impressed by the scale of anything.",
      spoiler: "Woken briefly to advise Cheng Xin during the Staircase Program era, he gives her the only counsel in the trilogy that would have saved everything: some problems are not yours to solve, and the person who can bear to be hated is the person who should hold the switch. She does not take it. He passes out of the story shortly after, and every catastrophe that follows is arguably a footnote to his being ignored." },
    } },
  { id: "yewenjie", name: "Ye Wenjie", books: {
    1: { cluster: "sci", role: "astrophysicist",
      desc: "A courteous, quiet woman near the end of a long career, whose youth was broken by the Cultural Revolution. Half the book is the present investigation; the other half is her life, and the two halves are looking for each other.",
      spoiler: "She is the first contact. Conscripted into Red Coast after her father is beaten to death and she is betrayed by Bai Mulin, she works out that the sun can be used as a radio amplifier and transmits into it; eight years later a reply arrives from a Trisolaran listener begging her not to answer, because answering will reveal Earth's position to a dying civilization that will come and take it. She answers anyway - 'Come here! I will help you conquer this world' - and then kills Yang Weining and Lei Zhicheng to bury the secret. Decades on she becomes the spiritual founder of the Earth-Trisolaris Organization, watches it split into Adventists who want humanity erased and Redemptionists who want it saved, gives Luo Ji the axioms of cosmic sociology almost in passing, and confesses everything at the end. Her last act is to climb Radar Peak at dusk: 'This is humanity's sunset.'" },

      desc: "She appears only briefly, at the start, and leaves a young astronomer with a question about the universe that he will not be able to put back down.",
      spoiler: "At her daughter's grave she meets Luo Ji and hands him, unprompted, the two axioms of cosmic sociology - survival is the primary need of civilization, and civilization grows while matter does not - plus chains of suspicion and technological explosion. Then she dies, having planted the exact seed that will end the war she started. She never learns it worked." },

  { id: "yezhetai", name: "Ye Zhetai", books: {

      desc: "Ye Wenjie's father. A theorist who will not say a thing he does not believe, at the exact moment in history when that is the most dangerous kind of honesty available.",
      spoiler: "He refuses to recant relativity or the Big Bang at a struggle session and is beaten to death on the stage by four teenage Red Guard girls, one of whom is his other daughter's comrade, while his wife denounces him to save herself and Ye Wenjie watches from the crowd. Everything the trilogy becomes is downstream of this scene: it is the moment Ye Wenjie stops believing humanity can correct itself from the inside." },

  { id: "shaolin", name: "Shao Lin", books: {

  { id: "yewenxue", name: "Ye Wenxue", books: {

  { id: "baimulin", name: "Bai Mulin", books: {

  { id: "yangweining", name: "Yang Weining", books: {

  { id: "evans", name: "Mike Evans", books: {

    } },
  { id: "dingyi", name: "Ding Yi", books: {
    1: { cluster: "sci", role: "theoretical physicist",
      desc: "Keeps a billiards table and uses it to make an unkind, unanswerable point about what experiments actually promise us.",
      spoiler: "Yang Dong's partner. The billiards demonstration - move the table and the ball goes elsewhere - is his way of showing Wang Miao what the accelerator results mean: identical experiments giving different answers implies there are no laws, and therefore no physics. He is one of the few who absorbs the sophon reveal without breaking, largely by treating it as an insult rather than a tragedy." },

/* ---------------------------------------------------------------- geometry */
const CANVAS_W = 1080;   // desktop canvas width
const COMPACT_W = 620;   // below this the layout switches to phone geometry
const NODE_R = 15;

// Deterministic jitter so the constellation looks hand-scattered but never
// moves between renders (no Math.random anywhere).
function wobble(seed, spread) {
  const s = Math.sin(seed * 12.9898) * 43758.5453;
  return ((s - Math.floor(s)) - 0.5) * 2 * spread;
}

// Lay out one book for a GIVEN canvas width, so the SVG can render at roughly
// 1:1 with CSS pixels instead of being scaled down to illegibility on a phone.
// Everything (ring radii, label room, row packing) is derived from `W`.
function layoutBook(entries, W = CANVAS_W) {
  const compact = W < COMPACT_W;
  const pad = compact ? 40 : 66;          // room under the outer ring for labels
  const byCluster = new Map();
  for (const e of entries) {
    if (!byCluster.has(e.cluster)) byCluster.set(e.cluster, []);
    byCluster.get(e.cluster).push(e);
  }
  const groups = [...byCluster.entries()]
    .map(([key, members]) => ({ key, members }))
    .sort((a, b) => b.members.length - a.members.length || a.key.localeCompare(b.key));

  // ring geometry per group, clamped so a cluster can never be wider than the
  // canvas (otherwise narrow screens clip the outermost names).
  const maxRing = Math.max(46, W / 2 - pad);
  for (const g of groups) {
    const n = g.members.length;
    if (n === 1) { g.rings = [{ r: 0, count: 1 }]; g.ring = 0; }
    else if (n <= 6) {
      g.ring = Math.min(maxRing, (compact ? 54 : 62) + n * 4);
      g.rings = [{ r: g.ring, count: n }];
    } else {
      const outer = Math.ceil(n * 0.62), inner = n - outer;
      // On a phone push the two rings further apart: adjacent tap targets need
      // real space between them, and vertical room is free (the page scrolls).
      g.ring = Math.min(maxRing, compact ? 72 + n * 4.2 : 78 + n * 3.4);
      g.rings = [{ r: g.ring, count: outer }, { r: g.ring * (compact ? 0.42 : 0.48), count: inner }];
    }
    g.box = Math.min(W, 2 * (g.ring + pad));
  }

  // greedy rows - on a phone this naturally becomes one cluster per row
  const rows = [];
  let row = [], rowW = 0;
  for (const g of groups) {
    if (row.length && rowW + g.box > W) { rows.push({ items: row, w: rowW }); row = []; rowW = 0; }
    row.push(g); rowW += g.box;
  }
  if (row.length) rows.push({ items: row, w: rowW });

  let y = 0;
  const placed = [];
  for (const r of rows) {
    const rowH = Math.max(...r.items.map((g) => g.box));
    let x = (W - r.w) / 2;
    for (const g of r.items) {
      const cx = x + g.box / 2, cy = y + rowH / 2;
      let i = 0;
      const nodes = [];
      for (const ring of g.rings) {
        for (let k = 0; k < ring.count; k++, i++) {
          const m = g.members[i];
          const a = -Math.PI / 2 + (k / ring.count) * Math.PI * 2 + (ring.r ? 0.22 : 0);
          const jx = compact ? 4 : 9, jy = compact ? 3 : 7;
          nodes.push({
            ...m,
            x: cx + Math.cos(a) * ring.r + wobble(i + g.key.length, ring.r ? jx : 0),
            y: cy + Math.sin(a) * ring.r * 0.86 + wobble(i * 3.1 + 1, ring.r ? jy : 0),
          });
        }
      }
      placed.push({ key: g.key, cx, cy, ring: g.ring, nodes });
      x += g.box;
    }
    y += rowH;
  }
  return { clusters: placed, width: W, compact, height: Math.max(y, compact ? 260 : 320) };
}

// Measure an element's live width so the layout can respond to the real
// viewport - phones, rotated phones, and a resized Streamlit iframe alike.
function useMeasuredWidth(ref, fallback) {
  const [w, setW] = useState(fallback);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const read = () => setW(Math.max(300, Math.round(el.clientWidth)));
    read();
    if (typeof ResizeObserver === "undefined") {
      window.addEventListener("resize", read);
      return () => window.removeEventListener("resize", read);
    }
    const ro = new ResizeObserver(read);
    ro.observe(el);
    return () => ro.disconnect();
  }, [ref]);
  return w;
}

              description here says only who a person is when you <i>meet</i> them
              in that book - never what they turn out to be. Each dossier also
              carries a <span className="inline-seal">⚠ sealed full entry</span> -
              everything through the end of that book - which stays shut until you
              open it yourself.
            </p>
          </div>
          <div className="corner-seal" aria-hidden="true"><span>录</span></div>
        </div>

        <div className="dial" role="tablist" aria-label="Book">
          {BOOKS.map((b) => (
            <button key={b.n} role="tab" aria-selected={book === b.n}
              className={`stamp ${book === b.n ? "on" : ""}`}
              onClick={() => { setBook(b.n); setSelected(null); setFocusCluster(null); setQuery(""); }}>
              <span className="cn">{b.cn}</span>
              <span className="rn">Book {b.roman}</span>
              <span className="en">{b.title}</span>
            </button>
          ))}
        </div>
        <p className="dialnote">
          <b>Book {activeBook.roman} · {activeBook.title}</b>
          <span className="hintline"> - {activeBook.tagline}</span>
        </p>
      </header>

      <div className="stage">
        <div className="canvas-wrap" ref={wrapRef}>
          <svg viewBox={`0 0 ${layout.width} ${layout.height}`} className={`canvas ${compact ? "sm" : ""}`}
            style={{ height: layout.height }}
            role="img" aria-label={`Characters of ${activeBook.title}`}>
            <defs>
              <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
                <feGaussianBlur stdDeviation="6" />
              </filter>
              <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="18" />
              </filter>
            </defs>

            <g key={book} className="sky">
              {layout.clusters.map((cl) => {
                const meta = CLUSTERS[cl.key];
                const dim = focusCluster && focusCluster !== cl.key;
                return (
                  <g key={cl.key} className={`cluster ${dim ? "dim" : ""}`}>
                    {/* nebula */}
                    <circle cx={cl.cx} cy={cl.cy} r={cl.ring + 34} fill={meta.color}
                      opacity={dim ? 0.03 : 0.09} filter="url(#softglow)" />
                    <text x={cl.cx} y={cl.cy} className="cluster-hanzi" fill={meta.color}
                      textAnchor="middle" dominantBaseline="central"
                      opacity={dim ? 0.07 : 0.16}>{meta.hanzi}</text>

                    {/* constellation lines: ring neighbours */}
                    {cl.nodes.length > 1 && cl.nodes.map((n, i) => {
                      const m = cl.nodes[(i + 1) % cl.nodes.length];
                      if (cl.nodes.length === 2 && i === 1) return null;
                      return <line key={i} x1={n.x} y1={n.y} x2={m.x} y2={m.y}
                        className="link" stroke={meta.color} />;
                    })}

                    {cl.nodes.map((n) => {
                      const on = selected === n.id, hot = hover === n.id;
                      const r = compact ? 12 : NODE_R;
                      return (
                        <g key={n.id} className={`node ${on ? "sel" : ""} ${hot ? "hot" : ""}`}
                          transform={`translate(${n.x},${n.y})`} tabIndex={0} role="button"
                          aria-label={n.name}
                          onClick={() => pick(on ? null : n.id)}
                          onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(on ? null : n.id); } }}
                          onPointerEnter={() => setHover(n.id)} onPointerLeave={() => setHover(null)}>
                          {/* invisible finger-sized hit area - a 12px star is not tappable */}
                          <circle r={compact ? 21 : 22} fill="transparent" />
                          {(on || hot) && <circle r={r + 12} fill={meta.color} opacity="0.5" filter="url(#glow)" />}
                          <circle r={r} className="disc" fill="#0b0e17"
                            stroke={meta.color} strokeWidth={on ? 2.6 : 1.4} />
                          <circle r={compact ? 4 : 4.6} fill={meta.color} className="core" />
                          <text y={r + (compact ? 15 : 17)} textAnchor="middle" className="node-label">{n.name}</text>
                        </g>
                      );
                    })}
                  </g>
                );
              })}
            </g>
          </svg>

          <div className="legend">
            {focusCluster && (
              <button className="chip all" onClick={() => setFocusCluster(null)}>&#215; all</button>
            )}
            {layout.clusters.map((cl) => (
              <button key={cl.key} className={`chip ${focusCluster === cl.key ? "act" : ""}`}
                onClick={() => setFocusCluster((f) => (f === cl.key ? null : cl.key))}>
                <i style={{ background: CLUSTERS[cl.key].color }} />
                {CLUSTERS[cl.key].name}
                <b>{cl.nodes.length}</b>
              </button>
            ))}
          </div>
          <p className="hint">Tap a star for its dossier · tap a group below to dim the rest</p>
        </div>

        <aside className="margin" ref={asideRef}>
          <div className="search">
            <input value={query} onChange={(e) => setQuery(e.target.value)}
              placeholder="Find a name…" aria-label="Search characters" />
            {matches.length > 0 && (
              <ul className="results">
                {matches.map((m) => (
                  <li key={m.id} onClick={() => { pick(m.id); setQuery(""); }}>
                    <i style={{ background: CLUSTERS[m.cluster].color }} />
                    <span>{m.name}</span><em>{m.role}</em>
                  </li>
                ))}
              </ul>
            )}
            {q && matches.length === 0 && <p className="noresult">Nobody by that name in Book {activeBook.roman}.</p>}
          </div>

          {sel ? (
            <Dossier entry={sel} alsoIn={alsoIn} book={activeBook}
              onBack={() => setSelected(null)} />
          ) : (
            <Contents book={activeBook} entries={entries} onPick={pick}
              focusCluster={focusCluster} setFocusCluster={setFocusCluster} />
          )}
        </aside>
      </div>
    </div>
  );
}

function Dossier({ entry, alsoIn, book, onBack }) {
  const meta = CLUSTERS[entry.cluster];
  // Sealed by default, and re-sealed whenever the character or book changes -
  // the reader must open it deliberately, every single time.
  const [open, setOpen] = useState(false);
  useEffect(() => { setOpen(false); }, [entry.id, book.n]);

  return (
    <div className="record">
      <button className="back" onClick={onBack}>← Contents</button>
      <span className="tag" style={{ color: meta.color, borderColor: meta.color }}>
        <b>{meta.hanzi}</b> {meta.name}
      </span>
      <h2 className="rec-title" style={{ color: meta.color }}>{entry.name}</h2>
      {entry.aka && <p className="aka">also called {entry.aka}</p>}
      <p className="role">{entry.role}</p>
      <p className="desc">{entry.desc}</p>
      <p className="safe">
        Spoiler-free: written as of your <b>first meeting</b> in Book {book.roman}.
      </p>

      {entry.spoiler && (
        <div className={`sealed ${open ? "open" : ""}`}>
          <button className="seal-btn" onClick={() => setOpen((o) => !o)}
            aria-expanded={open}>
            <span className="warn-mk">⚠</span>
            <span className="seal-text">
              <b>{open ? "Hide the full entry" : "Reveal the full entry"}</b>
              <em>Everything about {entry.name} through the end of Book {book.roman} - major spoilers.</em>
            </span>
            <span className="seal-chev">{open ? "▲" : "▼"}</span>
          </button>
          {open && (
            <div className="spoiler-body">
              <p className="spoiler-head">
                Spoilers · complete through the end of Book {book.roman} - and no further
              </p>
              <p className="spoiler-text">{entry.spoiler}</p>
            </div>
          )}
        </div>
      )}

      {alsoIn.length > 0 && (
        <p className="alsoin">Also in Book {alsoIn.join(" & ")} - switch tabs for that book's version of this entry.</p>
      )}
    </div>
  );
}

function Contents({ book, entries, onPick, focusCluster, setFocusCluster }) {
  const groups = useMemo(() => {
    const m = new Map();
    for (const e of entries) {
      if (!m.has(e.cluster)) m.set(e.cluster, []);
      m.get(e.cluster).push(e);
    }
    return [...m.entries()].sort((a, b) => b[1].length - a[1].length);
  }, [entries]);

  return (
    <div className="record">
      <h2 className="rec-title">Contents</h2>
      <p className="rec-vol">{book.cn} · Book {book.roman} · {entries.length} entries</p>

      {groups.map(([key, members]) => {
        const meta = CLUSTERS[key];
        const dim = focusCluster && focusCluster !== key;
        return (
          <section key={key} className={dim ? "dimsec" : ""}>
            <h4 style={{ color: meta.color }}
              onClick={() => setFocusCluster((f) => (f === key ? null : key))}>
              <span className="mk" style={{ borderColor: meta.color }}>{meta.hanzi}</span>
              {meta.name}
            </h4>
            {meta.note && <p className="cnote">{meta.note}</p>}
            <ul className="facelist">
              {members.map((m) => (
                <li key={m.id} onClick={() => onPick(m.id)}>
                  <i style={{ background: meta.color }} />
                  <span>{m.name}</span><em>{m.role}</em>
                </li>
              ))}
            </ul>
          </section>
        );
      })}

      <p className="warn">
        One leak is unavoidable: a name listed under a later book is, by that
        fact alone, still in the story then. Everything else here is written to
        tell you nothing you have not already read.
      </p>
    </div>
  );
}

const _root = ReactDOM.createRoot(document.getElementById("root"));
_root.render(<App />);

/* When embedded by Streamlit, tell the host iframe how tall we actually are.
   Otherwise the component sits in a fixed-height iframe and a phone ends up
   scrolling inside a scroll. Streamlit's component host listens for this
   message; if we are opened as a plain file, the postMessage is simply
   ignored and nothing breaks. */
(function reportHeight() {
  if (window.parent === window) return;   // not embedded
  let last = 0;
  const send = () => {
    const h = Math.ceil(document.documentElement.scrollHeight);
    if (Math.abs(h - last) < 4) return;
    last = h;
    try {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*");
    } catch (e) { /* cross-origin host: fall back to the iframe's fixed height */ }
  };
  send();
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(send).observe(document.body);
  window.addEventListener("resize", send);
  setTimeout(send, 300);   // after webfonts settle
})();
</script>
